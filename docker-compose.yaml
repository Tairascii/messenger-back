services:
  chats:
    build:
      context: .
      dockerfile: ./chats/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      messenger-db:
        condition: service_healthy
    
  user:
    build:
      context: .
      dockerfile: ./user/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      messenger-db:
        condition: service_healthy

  messenger-db:
    image: postgres:13.8-alpine
    container_name: messenger-db
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "6432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 1s
      retries: 30